<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Navbar Component – Computer Networks Lab</title>
    <style>
        /* ------------------------------
           1. RESET & BASE (navbar only)
           No interference with your page styles.
        -------------------------------- */
        .nav-wrapper * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .nav-wrapper {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: transparent;
            width: 100%;
            position: relative;
            z-index: 999;
        }

        /* Main navbar container – glass / modern look */
        .navbar {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            position: sticky;
            top: 0;
            width: 100%;
            transition: all 0.2s ease;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.85rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        /* Logo / Brand */
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }

        .brand-icon {
            font-size: 1.7rem;
            background: linear-gradient(135deg, #0f3b4f, #1a5f7a);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            box-shadow: 0 6px 12px -6px rgba(0,0,0,0.1);
        }

        .brand-text {
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #0a2a3b, #1d5a77);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .brand-sub {
            font-size: 0.7rem;
            font-weight: 400;
            color: #5f7f9a;
            margin-left: 0.2rem;
            display: inline-block;
        }

        /* Desktop Navigation List */
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-item {
            position: relative;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0.6rem 1.1rem;
            font-weight: 500;
            font-size: 0.95rem;
            border-radius: 60px;
            text-decoration: none;
            color: #1f3b4c;
            transition: all 0.2s ease;
            background: transparent;
            white-space: nowrap;
        }

        /* link icons (emoji or unicode) */
        .nav-icon {
            font-size: 1.2rem;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.05));
        }

        .nav-link:hover {
            background: #eef3fc;
            color: #0b4f6c;
            transform: translateY(-1px);
        }

        /* active page indicator */
        .nav-link.active {
            background: #0f3b4f;
            color: white;
            box-shadow: 0 4px 10px rgba(15,59,79,0.2);
        }

        .nav-link.active .nav-icon {
            filter: brightness(0) invert(1);
        }

        /* mobile toggle button (hamburger) */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            width: 44px;
            height: 44px;
            border-radius: 30px;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .menu-toggle:hover {
            background: #eef2f7;
        }

        .hamburger {
            width: 26px;
            height: 2px;
            background: #1f3b4c;
            position: relative;
            transition: all 0.3s;
        }

        .hamburger::before,
        .hamburger::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 2px;
            background: #1f3b4c;
            transition: all 0.3s;
        }

        .hamburger::before {
            top: -8px;
        }
        .hamburger::after {
            bottom: -8px;
        }

        /* mobile menu active state */
        .menu-toggle.active .hamburger {
            background: transparent;
        }
        .menu-toggle.active .hamburger::before {
            transform: rotate(45deg);
            top: 0;
        }
        .menu-toggle.active .hamburger::after {
            transform: rotate(-45deg);
            bottom: 0;
        }

        /* Responsive Styles */
        @media screen and (max-width: 1100px) {
            .nav-menu { gap: 0.1rem; }
            .nav-link { padding: 0.5rem 0.8rem; font-size: 0.85rem; }
        }

        @media screen and (max-width: 950px) {
            .menu-toggle {
                display: flex;
            }
            .nav-menu {
                position: fixed;
                left: -100%;
                top: 70px;
                flex-direction: column;
                background: rgba(255, 255, 255, 0.98);
                backdrop-filter: blur(12px);
                width: 100%;
                text-align: center;
                transition: 0.3s ease;
                box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.1);
                padding: 1.8rem 1.5rem;
                gap: 0.8rem;
                border-radius: 0 0 28px 28px;
                z-index: 1000;
                align-items: stretch;
                max-height: 80vh;
                overflow-y: auto;
            }
            .nav-menu.active {
                left: 0;
            }
            .nav-item {
                width: 100%;
            }
            .nav-link {
                justify-content: center;
                padding: 0.9rem;
                width: 100%;
                font-size: 1rem;
                white-space: normal;
            }
            .brand-text {
                font-size: 1.2rem;
            }
            .nav-container {
                flex-wrap: nowrap;
            }
        }

        /* For very small devices */
        @media screen and (max-width: 480px) {
            .nav-container {
                padding: 0.6rem 1rem;
            }
            .brand-text {
                font-size: 1rem;
            }
            .brand-icon {
                width: 32px;
                height: 32px;
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
<!-- this navbar wrapper is meant to be embedded in any HTML page -->
<div class="nav-wrapper">
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="nav-container">
            <!-- brand / home link -->
            <a href="#" class="nav-brand" id="brandHomeLink">
                <div class="brand-icon">🌐</div>
                <div class="brand-text">NetLab<span class="brand-sub"> · CSE</span></div>
            </a>

            <!-- desktop & mobile toggle -->
            <button class="menu-toggle" id="mobileMenuBtn" aria-label="Menu">
                <div class="hamburger"></div>
            </button>

            <!-- navigation links - includes ALL pages -->
            <ul class="nav-menu" id="navMenu">
                <!-- Core Labs -->
                <li class="nav-item">
                    <a href="#" class="nav-link" data-nav="home">
                        <span class="nav-icon">🏠</span>
                        <span>Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-nav="vlan">
                        <span class="nav-icon">🔗</span>
                        <span>VLAN / Inter-VLAN</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-nav="rip_ospf">
                        <span class="nav-icon">🔁</span>
                        <span>RIP + OSPF</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-nav="app_layer">
                        <span class="nav-icon">📡</span>
                        <span>Application Layer</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-nav="smart_home">
                        <span class="nav-icon">🏠</span>
                        <span>Smart Home IoT</span>
                    </a>
                </li>
                
                <!-- Enterprise Scenarios -->
                <li class="nav-item">
                    <a href="#" class="nav-link" data-nav="service_company">
                        <span class="nav-icon">🏢</span>
                        <span>Service Co.</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-nav="telecom">
                        <span class="nav-icon">📞</span>
                        <span>Telecom</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-nav="varsity">
                        <span class="nav-icon">🏛️</span>
                        <span>Varsity</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-nav="bank">
                        <span class="nav-icon">🏦</span>
                        <span>Bank</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-nav="it_farm">
                        <span class="nav-icon">🌾</span>
                        <span>IT Farm</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link" data-nav="library">
                        <span class="nav-icon">📚</span>
                        <span>Library</span>
                    </a>
                </li>
                
                <!-- Resources -->
                <li class="nav-item">
                    <a href="#" class="nav-link" data-nav="lab_manual">
                        <span class="nav-icon">📖</span>
                        <span>Lab Manual</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</div>

<script>
    (function() {
        // -------- Page mapping (ALL pages mapped) --------
        function getPageUrl(navId) {
            const pageMap = {
                'home': './index.html',
                'vlan': './vlan_subnet.html',
                'rip_ospf': './ospf_rip.html',
                'app_layer': './applicationLayer.html',
                'smart_home': './smart_home.html',
                'service_company': './service company.html',
                'telecom': './tele-Communication.html',
                'varsity': './varsity building.html',
                'bank': './Bank Branch.html',
                'it_farm': './It farm.html',
                'library': './Library Floor.html',
                'lab_manual': './lab_manual.html'
            };
            return pageMap[navId] || './index.html';
        }

        // -------- Helper: detect which page we are on based on URL ---------
        function getCurrentPageId() {
            const path = window.location.pathname;
            const filename = path.split('/').pop();
            
            // Home detection
            if (filename === 'index.html' || filename === '' || filename === '/' || filename === 'index') {
                return 'home';
            }
            // Core Labs
            if (filename.includes('vlan_subnet') || filename.includes('vlan')) return 'vlan';
            if (filename.includes('ospf_rip') || filename.includes('rip_ospf')) return 'rip_ospf';
            if (filename.includes('applicationLayer') || filename.includes('app_layer')) return 'app_layer';
            if (filename.includes('smart_home')) return 'smart_home';
            
            // Enterprise Scenarios
            if (filename.includes('service company') || filename.includes('service_company')) return 'service_company';
            if (filename.includes('tele-Communication') || filename.includes('telecom')) return 'telecom';
            if (filename.includes('varsity building') || filename.includes('varsity')) return 'varsity';
            if (filename.includes('Bank Branch') || filename.includes('bank')) return 'bank';
            if (filename.includes('It farm') || filename.includes('it_farm')) return 'it_farm';
            if (filename.includes('Library Floor') || filename.includes('library')) return 'library';
            
            // Resources
            if (filename.includes('lab_manual') || filename.includes('CN_lab_manual')) return 'lab_manual';
            
            return 'home';
        }

        // Mark active link based on current page
        function setActiveNavLink() {
            const current = getCurrentPageId();
            const allLinks = document.querySelectorAll('.nav-link');
            allLinks.forEach(link => {
                const navValue = link.getAttribute('data-nav');
                if (navValue === current) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }

        // attach click handlers to all nav links + brand home
        function initNavigation() {
            const allNavItems = document.querySelectorAll('.nav-link');
            const brandLink = document.getElementById('brandHomeLink');
            
            allNavItems.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const navId = link.getAttribute('data-nav');
                    if (navId) {
                        const targetUrl = getPageUrl(navId);
                        window.location.href = targetUrl;
                    }
                });
            });

            // brand / home: redirect to index page
            if (brandLink) {
                brandLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = './index.html';
                });
            }
        }

        // mobile toggle functionality
        function initMobileMenu() {
            const toggleBtn = document.getElementById('mobileMenuBtn');
            const navMenu = document.getElementById('navMenu');
            if (toggleBtn && navMenu) {
                toggleBtn.addEventListener('click', () => {
                    navMenu.classList.toggle('active');
                    toggleBtn.classList.toggle('active');
                });

                // Close mobile menu after clicking on any nav link
                const navLinks = document.querySelectorAll('.nav-link');
                navLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        if (navMenu.classList.contains('active')) {
                            navMenu.classList.remove('active');
                            toggleBtn.classList.remove('active');
                        }
                    });
                });
            }
        }

        // run when DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setActiveNavLink();
                initNavigation();
                initMobileMenu();
            });
        } else {
            setActiveNavLink();
            initNavigation();
            initMobileMenu();
        }
    })();
</script>
</body>
</html>
